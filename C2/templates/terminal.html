<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for the terminal look and feel */
        body {
            font-family: 'Fira Code', monospace;
            background-color: #0a0a0a;
            color: #f0f0f0;
        }

        /* Custom glow effect for the text */
        .text-glow {
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.7), 0 0 10px rgba(255, 0, 0, 0.5);
        }
        
        /* Custom border glow effect */
        .border-glow {
            box-shadow: 0 0 8px 2px rgba(220, 38, 38, 0.6);
        }

        /* Styling for the command input */
        #command-input {
            background-color: transparent;
            border: none;
            outline: none;
            width: 100%;
            color: #e5e7eb; /* A slightly off-white color */
        }

        /* Blinking cursor effect */
        #cursor {
            display: inline-block;
            background-color: #dc2626;
            width: 10px;
            height: 1.2em;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
            box-shadow: 0 0 5px rgba(220, 38, 38, 0.8);
        }

        @keyframes blink {
            from, to { background-color: transparent; }
            50% { background-color: #dc2626; }
        }

        /* Hide cursor when input is disabled */
        #command-input:disabled + #cursor {
            display: none;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="terminal" class="w-full max-w-4xl mx-auto h-[90vh] bg-black bg-opacity-70 border-2 border-red-700 rounded-lg shadow-lg p-4 flex flex-col font-mono text-sm border-glow">
        <!-- Terminal Header -->
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-red-900">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                <span class="w-3 h-3 bg-yellow-500 rounded-full"></span>
                <span class="w-3 h-3 bg-green-500 rounded-full"></span>
            </div>
            <p id="connection-status" class="text-red-500 text-glow font-bold">CLIENT DISCONNECTED</p>
            <div></div>
        </div>

        <!-- Terminal Output -->
        <div id="output" class="flex-grow overflow-y-auto pr-2">
            <!-- Output lines will be added here by JavaScript -->
        </div>

        <!-- Terminal Input -->
        <div class="mt-2 flex items-center">
            <span class="text-red-500 text-glow font-bold mr-2">user@device:~$</span>
            <div class="relative flex-grow flex items-center">
                <input type="text" id="command-input" class="w-full" autofocus autocomplete="off" spellcheck="false"/>
                <span id="cursor"></span>
            </div>
        </div>
    </div>

    <script>
        // DOM element references
        const terminalOutput = document.getElementById('output');
        const commandInput = document.getElementById('command-input');
        const connectionStatus = document.getElementById('connection-status');
        let isWaitingForResponse = false;

        // --- Initial welcome message ---
        function showWelcomeMessage() {
            const welcomeLines = [
                { text: 'Terminal interface initialized.', color: 'text-green-400' },
                { text: 'Waiting for client connection...', color: 'text-gray-400' },
                { text: 'Type `help` for a list of local commands.', color: 'text-gray-400' },
                { text: '--------------------------------------------------', color: 'text-red-700' },
            ];
            
            welcomeLines.forEach(line => {
                appendOutput(line.text, line.color);
            });
        }

        // --- Command Handling ---
        commandInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !isWaitingForResponse) {
                const command = commandInput.value.trim();
                if (command) {
                    appendOutput(`user@device:~$ ${command}`, 'text-red-500 font-bold');
                    handleCommand(command);
                }
                commandInput.value = '';
            }
        });

        // --- Command Logic ---
        function handleCommand(command) {
            const lowerCmd = command.toLowerCase();
            // Handle local commands first
            switch (lowerCmd) {
                case 'help':
                    showHelp();
                    break;
                case 'clear':
                    clearTerminal();
                    break;
                default:
                    // Send all other commands to the remote client
                    isWaitingForResponse = true;
                    commandInput.disabled = true;
                    sendCommandToServer(command);
                    pollForResponse(); // Start polling for the response
            }
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        // Send command to server
        async function sendCommandToServer(command) {
            try {
                await fetch('/api/send_command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command })
                });
            } catch (error) {
                appendOutput('Error: Could not send command to server.', 'text-yellow-500');
            }
        }

        // Polls for a response, with a timeout to prevent freezing.
        function pollForResponse() {
            let pollCount = 0;
            // New timeout: 75 polls * 200ms interval = 15-second timeout
            const maxPolls = 75; 

            const intervalId = setInterval(async () => {
                if (pollCount >= maxPolls) {
                    clearInterval(intervalId);
                    appendOutput('Error: Request timed out. Client may be busy or disconnected.', 'text-yellow-500');
                    reEnableInput();
                    return;
                }

                try {
                    const res = await fetch('/api/get_response');
                    const data = await res.json();
                    
                    // This now handles commands that produce no output (e.g., 'cd')
                    if (data.responses && data.responses.length > 0) {
                        clearInterval(intervalId);
                        data.responses.forEach(resp => {
                            // Sanitize response to prevent rendering HTML content
                            const sanitizedResp = resp.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                            if (sanitizedResp.trim() !== '') {
                                appendOutput(`<pre class="whitespace-pre-wrap">${sanitizedResp}</pre>`, 'text-gray-300');
                            }
                        });
                        reEnableInput();
                    }
                } catch (error) {
                    clearInterval(intervalId);
                    appendOutput('Error: Failed to fetch response from server.', 'text-yellow-500');
                    reEnableInput();
                }
                pollCount++;
            }, 200); // Poll every 200ms for a much faster feel
        }
        
        function reEnableInput() {
            isWaitingForResponse = false;
            commandInput.disabled = false;
            commandInput.focus();
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        // Check connection status periodically
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.connected) {
                    connectionStatus.textContent = 'CLIENT CONNECTED';
                    connectionStatus.classList.replace('text-red-500', 'text-green-500');
                } else {
                    connectionStatus.textContent = 'CLIENT DISCONNECTED';
                    connectionStatus.classList.replace('text-green-500', 'text-red-500');
                }
            } catch (error) {
                connectionStatus.textContent = 'SERVER UNREACHABLE';
                connectionStatus.classList.replace('text-green-500', 'text-red-500');
            }
        }
        setInterval(checkStatus, 5000); // Check connection every 5 seconds

        // --- Utility and Local Command Functions ---
        function appendOutput(html, className = 'text-gray-300') {
            const line = document.createElement('div');
            line.innerHTML = html;
            line.className = className;
            terminalOutput.appendChild(line);
        }

        function clearTerminal() {
            terminalOutput.innerHTML = '';
        }

        function showHelp() {
            const helpText = [
                { command: 'clear', description: 'Clear the terminal screen.' },
                { command: 'help', description: 'Show this help message.' },
                { command: 'Any other command', description: 'Will be executed on the remote client.' }
            ];
            appendOutput('Available Commands:', 'text-red-400 text-glow');
            helpText.forEach(item => {
                appendOutput(`<span class="w-32 inline-block">${item.command}</span> - ${item.description}`, 'text-gray-300');
            });
        }

        // --- Initial setup ---
        showWelcomeMessage();
        checkStatus(); // Initial check
        
        // Focus the input when clicking anywhere in the terminal
        document.getElementById('terminal').addEventListener('click', () => {
            commandInput.focus();
        });

    </script>

</body>
</html>
